# Public registry: FastAPI + SQLite on a persistent disk, Caddy for automatic HTTPS.
# Usage on the server: REGISTRY_DOMAIN=registry.example.com docker compose up -d
services:
  registry:
    image: ghcr.io/anjallll/caniollama-registry:latest
    restart: unless-stopped
    environment:
      COMPAT_REGISTRY_STORAGE_BACKEND: db
      COMPAT_REGISTRY_DATA_DIR: /data
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      REGISTRY_DOMAIN: ${REGISTRY_DOMAIN:?set REGISTRY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [registry]

volumes:
  caddy_data:
