name: Model compatibility report
description: A model behaves differently than caniollama reports
labels: [compatibility]
body:
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: llama3.1:8b
    validations:
      required: true
  - type: input
    id: ollama
    attributes:
      label: Ollama version
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: caniollama output
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and why
