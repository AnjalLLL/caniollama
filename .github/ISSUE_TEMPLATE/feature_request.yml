name: Feature request
description: Suggest an improvement or a new test case
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: suite
    attributes:
      label: Test suite
      options:
        - label: This changes the test suite (needs a SUITE_VERSION bump)
