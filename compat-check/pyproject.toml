[project]
name = "caniollama"
version = "0.1.3"
description = "Standardized compatibility checker for local Ollama model tool-calling support"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "caniollama contributors" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
caniollama = "compat_check.cli:app"

[project.urls]
Homepage = "https://github.com/AnjalLLL/caniollama"
Repository = "https://github.com/AnjalLLL/caniollama"
Issues = "https://github.com/AnjalLLL/caniollama/issues"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compat_check"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
