site_name: caniollama
site_description: Standardized compatibility checker for Ollama model tool-calling support.
site_url: https://anjalll.github.io/caniollama/
repo_url: https://github.com/AnjalLLL/caniollama
repo_name: AnjalLLL/caniollama
edit_uri: edit/main/docs/
strict: true
exclude_docs: |
  internal/

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Installation: installation.md
  - Cross-platform support: cross-platform-support.md
  - Privacy: privacy.md
  - Test suite spec: test-suite-spec.md
  - Registry:
      - API integration: api-integration.md
      - API spec: registry/api-spec.md
      - Data format: registry/data-format.md
      - Self-hosting: registry/deployment.md
